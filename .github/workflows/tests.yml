name: Research regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v

  # The 2026-09-26 outage was a test that only passed before a certain date. These scenarios run the
  # whole suite at chosen instants with a test-only virtual clock (tests/run_at_date.py); the daily
  # collection job is not repeated per date.
  date-scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        at:
          - '2026-09-26T03:00:00+00:00'   # the outage day (Saturday)
          - '2026-09-28T03:00:00+00:00'   # KST Monday: weekly steps join the plan
          - '2026-10-02T03:00:00+00:00'   # 2nd of a month: 3-day windows cross a month end
          - '2026-12-31T14:59:50+00:00'   # KST 23:59:50 on New Year's Eve
          - '2026-12-31T15:00:10+00:00'   # KST 00:00:10 on New Year's Day
          - '2027-02-15T03:00:00+00:00'
          - '2028-02-29T03:00:00+00:00'   # leap day
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tests/run_at_date.py '${{ matrix.at }}'
