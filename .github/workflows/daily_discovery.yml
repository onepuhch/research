name: Daily Discovery
on:
  schedule:
    - cron: '17 0 * * *'
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-state-writer
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      DISCOVERY: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 0 * * *' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate core behavior
        run: python -m unittest discover -s tests -v
      - name: Recover and migrate state
        id: migrate
        run: python scripts/migrate_v2.py
      - name: Process commands independently
        if: always() && steps.migrate.outcome == 'success'
        run: python scripts/telegram_cmd.py
      - name: Collect source documents
        id: collect
        if: always() && steps.migrate.outcome == 'success' && env.DISCOVERY == 'true'
        run: python scripts/collect.py
      - name: Extract grounded signals
        if: always() && steps.collect.outcome == 'success' && env.DISCOVERY == 'true'
        run: python scripts/extract.py
      - name: Observe tracked EPS
        if: always() && steps.migrate.outcome == 'success' && env.DISCOVERY == 'true'
        run: python scripts/collect_eps.py
      - name: Retry eligible notifications
        if: always() && steps.migrate.outcome == 'success' && env.DISCOVERY == 'true'
        run: python scripts/notify.py
      - name: Build research views
        if: always() && steps.migrate.outcome == 'success' && env.DISCOVERY == 'true'
        run: |
          python scripts/gen_report.py weekly
          python scripts/gen_report.py bottlenecks
          python scripts/gen_report.py quality
      - name: Weekly community watch and review report
        if: always() && steps.migrate.outcome == 'success' && env.DISCOVERY == 'true'
        run: |
          if [ "$(TZ=Asia/Seoul date +%u)" = '1' ]; then
            python scripts/collect_reddit.py
            python scripts/notify.py --report
          fi
      - name: Persist state even when a service fails
        if: always() && steps.migrate.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/persist_state.py
      - name: Retain generated review outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-reports-${{ github.run_id }}
          path: reports/generated/
          retention-days: 30
          if-no-files-found: ignore
