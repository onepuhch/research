name: Daily Discovery
on:
  schedule:
    - cron: '17 0 * * *'
    - cron: '23 */6 * * *'
  # The schedules are fallbacks: GitHub starts them hours late. An external timer
  # dispatches on time (mode=auto at 09:17 KST, mode=commands for command checks).
  # The daily cron acts as auto; the six-hourly cron is commands only.
  # scripts/daily_run_state.py decides which required steps still need to run today.
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily = rerun every step, auto = only steps not yet successful today, commands = Telegram commands only'
        type: choice
        options: [daily, auto, commands]
        default: daily
permissions:
  contents: write
concurrency:
  group: research-state-writer
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Secret first: public-repo logs would print a plain variable (it holds a contact email).
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
      DAILY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '17 0 * * *' && 'auto' || 'commands') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled events can wait with an old SHA; read current state after acquiring the writer slot.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate core behavior
        run: python -m unittest discover -s tests -v
      - name: Recover and migrate state
        id: migrate
        run: python scripts/migrate_v2.py
      - name: Plan today's remaining steps
        id: plan
        run: python scripts/daily_run_state.py plan --mode "$DAILY_MODE" --event "${{ github.event_name }}" >> "$GITHUB_ENV"
      - name: Process commands independently
        if: always() && steps.migrate.outcome == 'success'
        run: python scripts/telegram_cmd.py
      # Each step runs when the plan says so; the wrapper records started/success/failed
      # and passes the exit code through. A dependency that fails in this run skips its users.
      - name: Collect source documents
        id: collect
        if: always() && steps.plan.outcome == 'success' && env.RUN_COLLECT == 'true'
        run: python scripts/daily_run_state.py step collect -- python scripts/collect.py
      - name: Extract grounded signals
        id: extract
        # Never extracts from an older collection: collect must have succeeded today.
        if: always() && steps.plan.outcome == 'success' && env.RUN_EXTRACT == 'true' && steps.collect.outcome != 'failure'
        run: python scripts/daily_run_state.py step extract -- python scripts/extract.py
      - name: Observe tracked EPS
        id: eps
        if: always() && steps.plan.outcome == 'success' && env.RUN_EPS == 'true'
        run: python scripts/daily_run_state.py step eps -- python scripts/collect_eps.py
      - name: Retry eligible notifications
        if: always() && steps.plan.outcome == 'success' && env.RUN_NOTIFY == 'true' && steps.extract.outcome != 'failure'
        run: python scripts/daily_run_state.py step notify -- python scripts/notify.py
      - name: Observe quarterly EPS and revenue independently
        id: quarterly
        if: always() && steps.plan.outcome == 'success' && env.RUN_QUARTERLY == 'true'
        run: python scripts/daily_run_state.py step quarterly -- python scripts/collect_quarterly.py
      - name: Screen US stocks for sustained estimate upgrades
        if: always() && steps.plan.outcome == 'success' && env.RUN_SCREEN == 'true'
        # The script stops itself at time_budget_s (25 min); this is the hard stop.
        timeout-minutes: 28
        run: python scripts/daily_run_state.py step screen -- python scripts/screen_revisions.py
      - name: Observe tracked regular-session prices
        id: prices
        # Price collection remains independent of EPS availability.
        if: always() && steps.plan.outcome == 'success' && env.RUN_PRICES == 'true'
        run: python scripts/daily_run_state.py step prices -- python scripts/collect_prices.py
      - name: Build research views
        id: views
        if: >-
          always() && steps.plan.outcome == 'success' && env.RUN_VIEWS == 'true'
          && steps.extract.outcome != 'failure' && steps.eps.outcome != 'failure'
          && steps.quarterly.outcome != 'failure' && steps.prices.outcome != 'failure'
        run: >-
          python scripts/daily_run_state.py step views -- bash -ec 'python scripts/research_journal.py;
          python scripts/gen_report.py weekly; python scripts/gen_report.py bottlenecks;
          python scripts/gen_report.py quality; python scripts/gen_report.py cases'
      - name: Evaluate research price returns
        if: always() && steps.plan.outcome == 'success' && env.RUN_RETURNS == 'true'
        run: >-
          python scripts/daily_run_state.py step returns -- bash -ec 'python scripts/research_returns.py;
          python scripts/gen_report.py quality; python scripts/research_journal.py'
      - name: Weekly community watch
        if: always() && steps.plan.outcome == 'success' && env.RUN_COMMUNITY == 'true'
        run: python scripts/daily_run_state.py step community -- python scripts/collect_reddit.py
      - name: Weekly review report independently
        if: always() && steps.plan.outcome == 'success' && env.RUN_WEEKLY_REPORT == 'true' && steps.views.outcome != 'failure'
        run: python scripts/daily_run_state.py step weekly_report -- python scripts/notify.py --report
      - name: Refresh durable observation history
        if: always() && steps.migrate.outcome == 'success'
        run: python scripts/data_history.py --save
      - name: Close today's run record
        if: always() && steps.plan.outcome == 'success'
        run: python scripts/daily_run_state.py finish
      - name: Persist state even when a service fails
        if: always() && steps.migrate.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/persist_state.py
      - name: Retain generated review outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-reports-${{ github.run_id }}
          path: reports/generated/
          retention-days: 30
          if-no-files-found: ignore
